name: H Full History Final Odds 20260916

on:
  push:
    paths:
      - '.github/workflows/h-full-history-20260916.yml'
      - 'scripts/h_full_history_20260916.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout runner repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout final odds history
        run: git clone --depth 1 --branch gh-pages https://github.com/lamrongol/BoatraceOdds.git /tmp/odds

      - name: Checkout result history
        run: git clone --depth 1 --branch gh-pages https://github.com/lamrongol/BoatraceResults.git /tmp/results

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run frozen H full-history backtest
        run: |
          python scripts/h_full_history_20260916.py \
            --odds-root /tmp/odds \
            --results-root /tmp/results \
            --out H_FULL_HISTORY_RESULT.json \
            --end-date 2026-09-15

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: h-full-history-final-odds-20260916
          path: |
            H_FULL_HISTORY_RESULT.json
            H_FULL_HISTORY_RESULT.md

      - name: Commit research result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add H_FULL_HISTORY_RESULT.json H_FULL_HISTORY_RESULT.md
          if git diff --cached --quiet; then
            echo 'No result changes to commit'
          else
            git commit -m 'research(H): full-history final-odds backtest result'
            git push
          fi
