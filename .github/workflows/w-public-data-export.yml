name: w-public-data-export
on:
  push:
    paths:
      - 'scripts/w_public_data_export.py'
      - '.github/workflows/w-public-data-export.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public BoatRace data
        run: python scripts/w_public_data_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: w-public-data-20260909-20260915
          path: out/
          retention-days: 1
