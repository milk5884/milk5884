name: pv4-oos-replay
on:
  push:
    branches: [research/pv4-oos-replay]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pv4-oos-replay
      - name: Run frozen P-V4 OOS replay
        run: python run.py | tee run.log
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary.json selected.csv run.log
          git commit -m "P-V4 OOS replay results" || exit 0
          git push origin HEAD:research/pv4-oos-replay
      - uses: actions/upload-artifact@v4
        with:
          name: pv4-oos-replay-results
          path: |
            summary.json
            selected.csv
            run.log
