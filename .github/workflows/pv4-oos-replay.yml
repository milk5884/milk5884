name: pv4-oos-replay
on:
  push:
    branches: [research/pv4-oos-replay]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pv4-oos-replay
      - name: Run buying strategy exploration
        run: python explore.py | tee explore.log
      - name: Save exploration results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explore_summary.json explore_all.csv explore.log
          git commit -m "P-V4 buying strategy exploration results" || exit 0
          git push origin HEAD:research/pv4-oos-replay
      - uses: actions/upload-artifact@v4
        with:
          name: pv4-buying-strategy-results
          path: |
            explore_summary.json
            explore_all.csv
            explore.log
