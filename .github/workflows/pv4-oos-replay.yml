name: pv4-oos-replay
on:
  push:
    branches: [research/pv4-oos-replay]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pv4-oos-replay
      - name: Run targeted strategy verification
        run: python verify_market.py | tee verify.log
      - name: Save verification results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify_summary.json verify.log
          git commit -m "P-V4 strategy verification results" || exit 0
          git push origin HEAD:research/pv4-oos-replay
      - uses: actions/upload-artifact@v4
        with:
          name: pv4-strategy-verification
          path: |
            verify_summary.json
            verify.log
